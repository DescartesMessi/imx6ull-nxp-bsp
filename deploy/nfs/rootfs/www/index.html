<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i.MX6ULL 车载终端 · 远程监控</title>
<style>
  body { margin: 0; padding: 16px; font-family: system-ui, "Noto Sans CJK SC", sans-serif;
         background: #101820; color: #e8f1f8; text-align: center; }
  h1 { font-size: 20px; font-weight: 600; margin: 8px 0 16px; }
  .card { display: inline-block; padding: 10px; background: #182734;
          border: 1px solid #324b5e; border-radius: 12px; }
  img { max-width: 100%; display: block; border-radius: 8px; background: #000;
        min-width: 320px; min-height: 240px; }
  button { margin: 14px 6px 0; padding: 10px 18px; font-size: 15px; color: #fff;
           background: #1976a8; border: 0; border-radius: 8px; cursor: pointer; }
  button:active { background: #1384bd; }
  code { color: #70d6ff; }
  .hint { color: #8fa6b8; font-size: 13px; line-height: 1.7; }
</style>
</head>
<body>
<h1>i.MX6ULL 智能车载终端 · 远程监控</h1>

<div class="card">
  <img id="stream" src="?action=stream" alt="等待视频流">
</div>

<div>
  <button onclick="reconnect()">重新连接</button>
  <button onclick="snapshot()">抓一帧</button>
</div>

<p class="hint">
  MJPEG 流：<code>http://192.168.31.50:8080/?action=stream</code><br>
  单帧快照：<code>http://192.168.31.50:8080/?action=snapshot</code><br>
  哨兵模式只在 SR501 检测到人后推流，无人 10 秒自动停止；<br>
  页面打不开说明那一刻没有在推流，重新挥手触发或改用常开推流。
</p>

<script>
  const img = document.getElementById('stream');

  function reconnect() {
    img.src = '?action=stream&t=' + Date.now();
  }

  function snapshot() {
    img.src = '?action=snapshot&t=' + Date.now();
  }

  /* 流断开（触发结束/应用停流）时自动重试，便于观察下一次触发 */
  img.onerror = function () {
    setTimeout(reconnect, 2000);
  };
</script>
</body>
</html>
